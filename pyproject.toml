[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pokeagent"
version = "1.0.0"
description = "A modular Pokemon Pokedex agent starting with the original 151 Kanto Pokemon."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32,<3",
    "streamlit>=1.40,<2",
]
[project.scripts]
pokeagent = "pokeagent.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]
